- type: entity
  parent: BaseAction
  id: ActionLifeSteal
  name: Life Drain
  description: Drains the victim, restoring you.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _Stories/Actions/force.rsi
      state: steal    
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/radpulse1.ogg
  - type: EntityTargetAction    
    whitelist:
      components:
      - Body
    canTargetSelf: false    
    event: !type:EntityTargetForceUserActionEvent
      volume: 7.5
      event: !type:StealLifeTargetEvent
        doAfterTime: 1
  - type: TargetAction
    range: 2
    interactOnMiss: false

- type: entity
  parent: BaseAction
  id: ActionInquisitorGhost
  name: Shadow ghost
  description: Become a ghost and pass through walls. In this state, you cannot affect the world, but you can always return.
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    icon:
      sprite: _Stories/Actions/force.rsi
      state: inquisitor
  - type: InstantAction
    event: !type:DoAfterUserEvent
      hidden: false
      needHand: false
      delay: 3
      breakOnDamage: true
      breakOnMove: true
      event: !type:InstantForceUserActionEvent
        volume: 100
        event: !type:InquisitorPolymorphEvent

- type: entity
  parent: BaseAction
  id: ActionFrozeBullets
  name: Force Slow
  description: Use telekinesis to stop bullets around you for 10 seconds.
  components:
  - type: Action
    useDelay: 5
    icon:
      sprite: _Stories/Actions/force.rsi
      state: stopbullets
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:InstantForceUserActionEvent
      volume: 50
      event: !type:FrozeBulletsActionEvent
        seconds: 100

