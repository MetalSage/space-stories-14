- type: entity
  parent: BaseAction
  id: ActionRecliningPulse
  name: Repel
  description: Push everyone around you away.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction    
    icon:
      sprite: _Stories/Actions/force.rsi
      state: pulse
  - type: InstantAction
    event: !type:InstantForceUserActionEvent
      volume: 100
      event: !type:RecliningPulseEvent
        strength: 15
        stun: 3
        range: 5

- type: entity
  parent: BaseAction
  id: ActionStrangle
  name: Force choke
  description: Choking technique of no-contact combat.
  components:
  - type: Action
    useDelay: 10
    icon:
      sprite: _Stories/Actions/force.rsi
      state: strangle
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/radpulse1.ogg
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false 
    event: !type:EntityTargetForceUserActionEvent
      volume: 7.5
      event: !type:StrangleTargetEvent
        doAfterTime: 1
  - type: TargetAction
    range: 2
    interactOnMiss: false

- type: entity
  parent: BaseAction
  id: ActionLightningStrike
  name: Force Lightning
  description: Direct lightning from your hands into your enemy.
  components:
  - type: Action
    useDelay: 5
    icon:
      sprite: _Stories/Actions/force.rsi
      state: lightning
    itemIconStyle: BigAction
  - type: EntityTargetAction    
    canTargetSelf: false
    event: !type:EntityTargetForceUserActionEvent
      volume: 50
      event: !type:LightningStrikeEvent
  - type: TargetAction
    range: 10
    interactOnMiss: false

- type: entity
  parent: BaseAction
  id: ActionIgniteTarget
  name: Pyrokinesis
  description: Causes a slight burnout in the enemy.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _Stories/Actions/force.rsi
      state: ignite
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/rumble.ogg
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:EntityTargetForceUserActionEvent
      volume: 75
      event: !type:IgniteTargetActionEvent
        stackAmount: 3.1
  - type: TargetAction
    range: 10
    interactOnMiss: false

- type: entity
  parent: BaseAction
  id: ActionHypnosis
  name: Force Hypnosis
  description: Converts the victim to the Emperor's side.
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
    icon:
      sprite: _Stories/Actions/force.rsi
      state: hypnosis
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:DoAfterTargetEvent
      hidden: true
      needHand: true
      delay: 10
      breakOnDamage: true
      breakOnMove: true
      event: !type:EntityTargetForceUserActionEvent
        volume: 100
        event: !type:HypnosisTargetActionEvent
  - type: TargetAction
    range: 1
    interactOnMiss: false

- type: entity
  parent: BaseAction
  id: ActionInquisitorRevertPolymorph
  name: Return to normal form
  description: Stop running and fight!
  components:
  - type: Action
    icon:
      sprite: _Stories/Actions/force.rsi
      state: inquisitor
  - type: InstantAction
    event: !type:RevertPolymorphActionEvent
