- type: entity
  parent: BaseAction
  id: ActionForceShop
  name: "[color=purple]Skill store[/color]"
  description: Remember what you had to do.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: skill
  - type: InstantAction
    event: !type:ForceShopActionEvent
- type: entity
  parent: BaseAction
  id: ActionStopProtectiveBubble
  name: Disable protective bubble
  description: Disables the protective bubble around you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: stopshield
  - type: InstantAction    
    event: !type:StopProtectiveBubbleEvent
- type: entity
  parent: BaseAction
  id: ActionRecallEquipments
  name: Summon equipment
  description: Summon your equipment to you.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: equip
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 50
      event: !type:RecallEquipmentsEvent
- type: entity
  parent: BaseAction
  id: ActionForceLookUp
  name: Listen to the Force
  description: Listen to the Force and find out if there are other Force users within a 25-meter radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: lookup
  - type: InstantAction
    event: !type:InstantForceUserActionEvent
      volume: 5
      event: !type:ForceLookUpActionEvent
- type: entity
  parent: BaseAction
  id: ActionRecallLightsaber
  name: Summon lightsaber
  description: Teleport your lightsaber to you. The farther the saber is, the more time it will take to pull it back a second time.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: sword
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 25
      event: !type:RecallLightsaberEvent
- type: entity
  parent: BaseAction
  id: ActionTelekinesis
  name: Telekinesis
  description: Your hand will be able to manipulate gravity around objects. Levitate your sword to fight from a distance.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: telekines
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 5
      event: !type:HandTetherGunEvent
- type: entity
  parent: BaseAction
  id: ActionFlashArea
  name: Force Blindness
  description: Create bursts of energy using telekinesis, causing temporary blindness.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: flash
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 25
      event: !type:FlashAreaEvent
- type: entity
  parent: BaseAction
  id: ActionArtOfMovement
  name: Art of Movement
  description: Speeds you up, blocks your pain for a short time.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    checkCanInteract: false

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: movement
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 100
      event: !type:InjectReagentsEvent
        solution:
          maxVol: 15
          reagents:
          - ReagentId: Stimulants
            Quantity: 15
- type: entity
  parent: BaseAction
  id: ActionEmp
  name: Ionization
  description: Create an EMP pulse in a small radius.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: emp
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 25
      event: !type:EmpActionEvent
        range: 1.75
        energyConsumption: 50000
        disableDuration: 10
- type: entity
  parent: BaseAction
  id: ActionFreedom
  name: Break cuffs
  description: Remove handcuffs using telekinesis.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    checkCanInteract: false
    itemIconStyle: NoItem

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: freedom
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 50
      event: !type:FreedomActionEvent
- type: entity
  parent: BaseAction
  id: ActionForceDash
  name: Force dash
  description: Leap at high speed to the target point. Just not into a wall, please.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/blink.ogg

  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: dash
  - type: WorldTargetAction
    event: !type:WorldTargetForceUserActionEvent
      volume: 50
      event: !type:ForceDashActionEvent
        strength: 20
  - type: TargetAction
    range: 0
    checkCanAccess: false
- type: entity
  parent: BaseAction
  id: ActionForceKnock
  name: Knock
  description: A special technique that allows opening all nearby doors. Rumor has it that the Space Wizard Federation filed the first patent for this spell.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 3
    itemIconStyle: BigAction
  - type: Sprite
    sprite: _Stories/Actions/force.rsi
    layers:
    - state: knock
  - type: InstantAction
    event: !type:InstantForceUserActionEvent
      volume: 25
      event: !type:KnockSpellEvent
