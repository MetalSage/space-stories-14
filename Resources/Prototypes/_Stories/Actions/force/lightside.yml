- type: entity
  parent: BaseAction
  id: ActionCreateProtectiveBubble
  name: Protective bubble
  description: Create a protective telekinetic cocoon that reflects all lasers, greatly reduces damage from bullets, and protects against explosions and pressure. Offers almost no protection against melee attacks.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 300
    icon:
      sprite: _Stories/Actions/force.rsi
      state: shield
    itemIconStyle: NoItem
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 100
      event: !type:CreateProtectiveBubbleEvent

- type: entity
  parent: BaseAction
  id: ActionGuardianForceWall
  name: Force Barrier
  description: Create an indestructible 3x1 barrier in the direction of your view, which will stop your enemies. You can pass through your barrier.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    priority: -17
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
    icon:
      sprite: _Stories/Actions/force.rsi
      state: forcewall
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 100
      event: !type:InstantSpawnSpellEvent
        prototype: WallForceGuardian
        posData: !type:TargetInFront

- type: entity
  parent: BaseAction
  id: ActionHibernationTrance
  name: Hibernation trance
  description: You will heal many of your wounds, satisfy your hunger and thirst, stop bleeding, but you will sleep for 2 minutes. You can enter a trance even in a critical state.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 180
    icon:
      sprite: _Stories/Actions/force.rsi
      state: trance
    itemIconStyle: NoItem
    checkCanInteract: false
  - type: InstantAction    
    event: !type:InstantForceUserActionEvent
      volume: 100
      event: !type:InjectReagentsEvent
        solution:
          maxVol: 150
          reagents:
          - ReagentId: Epinephrine
            Quantity: 15
          - ReagentId: TranexamicAcid
            Quantity: 15
          - ReagentId: Omnizine
            Quantity: 30
          - ReagentId: Nutriment
            Quantity: 30
          - ReagentId: Water
            Quantity: 30
          - ReagentId: Nocturine
            Quantity: 30

- type: entity
  parent: BaseAction
  id: ActionHealingTouch
  name: Healing touch
  description: Heals minor injuries. Can be used on yourself.
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    icon:
      sprite: _Stories/Actions/force.rsi
      state: healingtouch
    sound: !type:SoundPathSpecifier
      path: /Audio/Items/Medical/ointment_begin.ogg
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: true
    event: !type:DoAfterTargetEvent
      needHand: true
      delay: 2
      breakOnDamage: true
      breakOnMove: true
      event: !type:EntityTargetForceUserActionEvent
        volume: 25
        event: !type:InjectReagentsToTargetEvent
          solution:
            maxVol: 7.5
            reagents:
            - ReagentId: Omnizine
              Quantity: 7.5
  - type: TargetAction
    range: 1
    interactOnMiss: false

- type: entity
  parent: BaseAction
  id: ActionPushBall
  name: Force push
  description: Create a powerful push that can knock a person down. Completely weakens after traveling 4 tiles.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _Stories/Actions/force.rsi
      state: push
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/forcewall.ogg
  - type: WorldTargetAction
    event: !type:WorldTargetForceUserActionEvent
      volume: 50
      event: !type:ProjectileSpellEvent
        prototype: GuardianPushBall
  - type: TargetAction
    range: 60
    checkCanAccess: false