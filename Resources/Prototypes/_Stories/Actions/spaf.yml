- type: entity
  parent: BaseAction
  id: ActionSpafStealth
  name: "[color=limegreen]Invisibility mode[/color]"
  description: Spend 30 units of food to disguise yourself for 5 seconds.
  components:
  - type: Action
    useDelay: 15
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_stealth
  - type: InstantAction
    event: !type:SpafStealthEvent
      cost: 30
      seconds: 5

- type: entity
  parent: BaseToggleAction
  id: ActionSpafLight
  name: "[color=orange]Glowing essence[/color]"
  description: Produce a glowing essence to light your path.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_light
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  parent: BaseAction
  id: ActionSpafLube
  name: "[color=purple]Slime[/color]"
  description: Spend 30 units of food to secrete very slippery slime.
  components:
  - type: Action
    useDelay: 15
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_lube
  - type: InstantAction
    event: !type:SpafSpillSolutionEvent
      cost: 30
      solution:
        maxVol: 12
        reagents:
          - ReagentId: SpaceLube
            Quantity: 12

- type: entity
  parent: BaseAction
  id: ActionSpafMine
  name: "[color=rosybrown]Organic trap[/color]"
  description: Spend 40 units of food to create an organic trap that temporarily stuns enemies.
  components:
  - type: Action
    useDelay: 15
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_mine
  - type: InstantAction
    event: !type:SpafCreateEntityEvent
      cost: 40
      proto: LandMineSpaf

- type: entity
  parent: BaseAction
  id: ActionSpafFood
  name: "[color=lightseagreen]Mysterious knowledge[/color]"
  description: A method unknown to science that allows you to determine how full your stomach is to the nearest hundredth.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_food 
  - type: InstantAction
    event: !type:FoodPopupEvent

- type: entity
  parent: BaseAction
  id: ActionSpafGlue
  name: "[color=darkslateblue]Sticky slime[/color]"
  description: Spend 10 units of food to secrete sticky slime.
  components:
  - type: Action
    useDelay: 5
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_glue
  - type: InstantAction
    event: !type:SpafSpillSolutionEvent
      cost: 10
      solution:
        maxVol: 12
        reagents:
          - ReagentId: Slime
            Quantity: 12

- type: entity
  parent: BaseAction
  id: ActionSpafEgg
  name: "[color=orange]New life[/color]"
  description: Spend 150 units of food to create an egg with a small copy of yourself.
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_egg
  - type: InstantAction
    event: !type:SpafCreateEntityEvent
      cost: 150
      proto: MobSpafEgg

- type: entity
  parent: BaseAction
  id: ActionSpafEvol
  name: "[color=blue]Evolution[/color]"
  description: Spend 100 units of food to evolve into an adult.
  components:
  - type: Action
    useDelay: 60
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_evol
  - type: InstantAction
    event: !type:SpafPolymorphEvent
      cost: 100
      protoId: MobSpaf

- type: entity
  parent: BaseToggleAction
  id: ActionSpafDevour
  name: "[color=lime]Absorption[/color]"
  description: Devour your victim to satisfy your hunger.
  components:
  - type: Action
    icon:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_devour
    iconOn:
      sprite: _Stories/Actions/spaf.rsi
      state: spaf_devour_on
  - type: TargetAction
  - type: EntityTargetAction
    event: !type:DevourActionEvent
