- type: markingsGroup
  parent: Undergarments
  id: STFelinid
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ STFelinidTailBasic ]
    enum.HumanoidVisualLayers.Chest:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: true
      default: [ STFelinidEarsBasic ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: STAppearanceFelinid
  name: felinid appearance
  components:
  - type: InitialBody
    organs:
      Torso: STOrganFelinidTorso
      Head: STOrganFelinidHead
      ArmLeft: STOrganFelinidArmLeft
      ArmRight: STOrganFelinidArmRight
      HandRight: STOrganFelinidHandRight
      HandLeft: STOrganFelinidHandLeft
      LegLeft: STOrganFelinidLegLeft
      LegRight: STOrganFelinidLegRight
      FootLeft: STOrganFelinidFootLeft
      FootRight: STOrganFelinidFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: OrganReptilianStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: STFelinid

- type: entity
  parent:
  - STAppearanceFelinid
  - BaseSpeciesMobOrganic
  id: STMobFelinid
  name: Urist McFelinid
  components:
  - type: FootstepModifier
    footstepSoundCollection: null
  - type: FlashDebuff
  - type: Sprite
    drawdepth: Mobs
  - type: Vocal
    emoteSounds: STMaleFelinid
  - type: Speech
    allowedEmotes: ['STHiss', 'STMeow', 'STMew', 'Growl', 'STPurr']

- type: entity
  parent: OrganBase
  id: STOrganFelinid
  abstract: true
  suffix: STFelinid

- type: entity
  parent: STOrganFelinid
  id: STOrganFelinidExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: STFelinid

- type: entity
  id: STOrganFelinidTorso
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidHead
  parent: [ OrganBaseHeadSexed, OrganBaseHead, STOrganFelinidExternal ]
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout

- type: entity
  id: STOrganFelinidArmLeft
  parent: [ OrganBaseArmLeft, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidArmRight
  parent: [ OrganBaseArmRight, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidHandLeft
  parent: [ OrganBaseHandLeft, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidHandRight
  parent: [ OrganBaseHandRight, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidLegLeft
  parent: [ OrganBaseLegLeft, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidLegRight
  parent: [ OrganBaseLegRight, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidFootLeft
  parent: [ OrganBaseFootLeft, STOrganFelinidExternal ]

- type: entity
  id: STOrganFelinidFootRight
  parent: [ OrganBaseFootRight, STOrganFelinidExternal ]
