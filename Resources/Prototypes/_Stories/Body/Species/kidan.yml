- type: markingsGroup
  parent: Undergarments
  id: STKidan
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      default: [ STKidanHeadNormal ]
      required: true
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: STAppearanceKidan
  name: kidan appearance
  components:
  - type: InitialBody
    organs:
      Torso: STOrganKidanTorso
      Head: STOrganKidanHead
      ArmLeft: STOrganKidanArmLeft
      ArmRight: STOrganKidanArmRight
      HandRight: STOrganKidanHandRight
      HandLeft: STOrganKidanHandLeft
      LegLeft: STOrganKidanLegLeft
      LegRight: STOrganKidanLegRight
      FootLeft: STOrganKidanFootLeft
      FootRight: STOrganKidanFootRight
      Brain: OrganHumanBrain
      Eyes: STOrganKidanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: STOrganKidanStomach
      Liver: STOrganKidanLiver
      Kidneys: OrganAnimalKidneys
  - type: HumanoidProfile
    species: STKidan

- type: entity
  parent:
  - STAppearanceKidan
  - BaseSpeciesMobOrganic
  id: STMobKidan
  name: Urist McKidan
  components:
  - type: Icon
    sprite: _Stories/Mobs/Species/Kidan/parts.rsi
    state: full
  - type: Speech
    allowedEmotes: ['STGrumble', 'STMoan', 'STWigglesAntennae', 'STWavesAntennaeSharply']
  - type: Butcherable
    spawned:
    - id: FoodMeat
      amount: 5
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 300
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#808A51"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - STChitine
  - type: ActiveRadio
    channels:
    - STChitine
  - type: KidanAccent
  - type: Vocal
    emoteSounds: STMaleKidan
  - type: Damageable
    damageModifierSet: STKidan
  - type: Bioluminescence
  - type: MeleeWeapon
    animation: WeaponArcClaw
    soundHit:
      collection: AlienClaw
    damage:
      types:
        Slash: 5
  - type: PointLight
    energy: 1.5
    radius: 3
    color: "#556b2f"
    enabled: false
  - type: Temperature
    temperature: 310.15
    specificHeat: 42
  - type: TemperatureDamage
    heatDamageThreshold: 400
    coldDamageThreshold: 285
    coldDamage:
      types:
        Cold : 0.1
    heatDamage:
      types:
        Heat : 0.1
  - type: MovementSpeedModifier
    baseWalkSpeed : 2.7
    baseSprintSpeed : 4.5
  - type: Perishable
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: MindContainer
  - type: Input
    context: "human"
  - type: MobMover
  - type: InputMover
  - type: Alerts
  - type: Eye
  - type: CameraRecoil
  - type: Examiner
  - type: CanHostGuardian
  - type: NpcFactionMember
    factions:
      - NanoTrasen
  - type: Respirator
    damage:
     types:
      Asphyxiation: 1.0
    damageRecovery:
      types:
        Asphyxiation: -1.0

- type: entity
  parent: OrganBase
  id: STOrganKidan
  abstract: true
  suffix: STKidan
  components:
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

