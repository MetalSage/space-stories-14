    solutions:
    - STSolutionStomachKidan
  - type: Stomach
    specialDigestible:
      tags:
      - Fruit
      - Meat
      - Pill
      - Crayon
      - FoodSnack

- type: entity
  id: STOrganKidanLiver
  parent: OrganAnimalLiver
