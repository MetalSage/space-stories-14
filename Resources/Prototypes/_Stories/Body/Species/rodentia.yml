- type: entity
  parent: BaseSpeciesAppearance
  id: STAppearanceRodentia
  name: rodentia appearance
  components:
  - type: InitialBody
    organs:
      Torso: STOrganRodentiaTorso
      Head: STOrganRodentiaHead
      ArmLeft: STOrganRodentiaArmLeft
      ArmRight: STOrganRodentiaArmRight
      HandRight: STOrganRodentiaHandRight
      HandLeft: STOrganRodentiaHandLeft
      LegLeft: STOrganRodentiaLegLeft
      LegRight: STOrganRodentiaLegRight
      FootLeft: STOrganRodentiaFootLeft
      FootRight: STOrganRodentiaFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganAnimalHeart
      Stomach: STOrganRodentiaStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: STRodentia

- type: entity
  save: false
  parent:
  - STAppearanceRodentia
  - BaseSpeciesMobOrganic
  id: STMobRodentia
  name: Urist McRat
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      180: Dead
  - type: SlowOnDamage
    speedModifierThresholds:
      60: 0.9
      80: 0.7
  - type: StandingState
    crawlingSpeedModifier: 0.5
  - type: Icon
    sprite: _Stories/Mobs/Rodentia/parts.rsi
    state: full
  - type: Speech
    speechVerb: STRodentia
    speechSounds: Squeak
    allowedEmotes: ['Squeak']
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
  - type: Vocal
    emoteSounds: STMaleRodentia
  - type: Inventory
    speciesId: rodentia

- type: entity
  parent: OrganBase
  id: STOrganRodentia
