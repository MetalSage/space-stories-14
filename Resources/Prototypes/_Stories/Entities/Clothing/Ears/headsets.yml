- type: entity
  parent: ClothingHeadset
  id: STClothingHeadsetIAA
  name: interior affairs headset
  description: A headset so that the internal affairs agent could hear the captain's last words.
  components:
    - type: ContainerFill
      containers:
        key_slots:
          - STEncryptionKeyIAA
    - type: Sprite
      sprite: Clothing/Ears/Headsets/servicesecurity.rsi

- type: entity
  parent: ClothingHeadset
  id: STClothingHeadsetJuridical
  name: juridical headset
  description: A headset to make sure everyone hears you.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - STEncryptionKeyJuridical
      - EncryptionKeySecurity
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Stories/Clothing/Ears/Headsets/juridical.rsi

- type: entity
  parent: ClothingHeadset
  id: STClothingHeadsetBlueshield
  name: blueshield headset
  description: The headset of the bodyguard who keeps the administration alive.
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - STEncryptionKeyBlueshield
      - EncryptionKeyCommon
  - type: Sprite
    sprite: _Stories/Clothing/Ears/Headsets/blueshield.rsi
    state: icon
  - type: Clothing
    sprite: _Stories/Clothing/Ears/Headsets/blueshield.rsi
