- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatHoodGuardianhood
  name: jedi hood
  categories: [ HideSpawnMenu ]
  description: Cool enough for you to wear.
  components:
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: Tag
    tags:
      - ForceRecallEquipment
  - type: Sprite
    sprite: _Stories/Clothing/Head/Hoods/guardian.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Head/Hoods/guardian.rsi

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatHoodInquisitor
  name: inquisitor hood
  categories: [ HideSpawnMenu ]
  description: What kind of villain are you without a cool hood?
  components:
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
  - type: TemperatureProtection
    heatingCoefficient: 0.005
    coolingCoefficient: 0.005
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: Tag
    tags:
      - ForceRecallEquipment
  - type: Sprite
    sprite: _Stories/Clothing/Head/Hoods/helmet_inquisitor.rsi
  - type: Clothing
    sprite: _Stories/Clothing/Head/Hoods/helmet_inquisitor.rsi

