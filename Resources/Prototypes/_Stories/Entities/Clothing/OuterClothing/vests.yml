- type: entity
  parent: ClothingOuterArmorBasic
  id: ClothingOuterVestGuardianNt
  name: blade guardian's insulated armor vest
  description: Because someone said body armor could be insulated. Your shield is already insulated!
  components:
    - type: Tag
      tags:
        - ForceRecallEquipment
        - WhitelistChameleon
    - type: TemperatureProtection
      heatingCoefficient: 0.005
      coolingCoefficient: 0.005
    - type: Sprite
      sprite: _Stories/Clothing/OuterClothing/Vests/guardian_nt.rsi
    - type: Clothing
      sprite: _Stories/Clothing/OuterClothing/Vests/guardian_nt.rsi

