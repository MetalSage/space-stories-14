- type: entity
  id: STSlaughterDemonJauntEffect
  name: demon dissolves into blood
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.7
  - type: Transform
    noRot: true
  - type: Sprite
    noRot: true
    sprite: _Stories/Effects/demons.rsi
    state: jaunt
    netsync: false
    drawdepth: Effects
  - type: PointLight
    color: "#8B0000"
    radius: 3
    energy: 2
  - type: LightFade
    duration: 0.6

