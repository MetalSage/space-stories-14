- type: entity
  id: STBaseEffectProtectiveBubble
  abstract: true
  components:
  - type: EffectVisuals
  - type: AnimationPlayer
  - type: Tag
    tags:
    - HideContextMenu
  - type: PointLight
    radius: 3
    energy: 2
    color: white
  - type: Physics
    bodyType: Static
  - type: AmbientSound
    volume: -10
    range: 14
    sound:
      path: /Audio/Effects/Grenades/Supermatter/whitehole_loop.ogg

- type: entity
  id: STEffectProtectiveBubble
  categories: [ HideSpawnMenu ]
  parent: STBaseEffectProtectiveBubble
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Weapons/block_metal1.ogg
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: MobState
    allowedStates:
      - Alive
  - type: Damageable
    damageModifierSet: STProtectiveBubble
  - type: Injurable
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 185
        mask:
        - Impassable
        layer:
        - MobLayer
        - None
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Objects/Weapons/Effects
      state: shield3_bad

- type: entity
  id: STEffectInquisitorProtectiveBubble
  categories: [ HideSpawnMenu ]
  parent: STBaseEffectProtectiveBubble
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.75
        density: 185
        mask:
        - ItemMask
        layer:
        - ItemMask
  - type: PointLight
    radius: 3
    energy: 2
    color: Red
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Objects/Weapons/Effects
      state: inquisitor_shield
