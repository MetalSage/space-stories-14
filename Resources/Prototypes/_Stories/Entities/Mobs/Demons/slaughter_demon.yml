- type: entity
  id: STMobSlaughterDemon
  parent:
  - BaseSimpleMob
  - MobAtmosExposed
  - MobCombat
  - MobBloodstream
  - MobFlammable
  name: демон резни
  description: Огромное угрожающее существо, покрытое бронированной чёрной чешуёй. Вам стоит бежать!
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Demons/slaughter_demon.rsi
    layers:
    - state: daemon
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Dead
  - type: MeleeWeapon
    range: 1.5
    angle: 0
    animation: WeaponArcThrust
    wideAnimation: WeaponArcThrust
    soundHit:
      path: /Audio/_Stories/Demons/Common/demon_attack1.ogg
    damage:
      types:
        Slash: 20
        Blunt: 10
  - type: NpcFactionMember
    factions:
    - STDemon
  - type: DemonDeathSound
    sound:
      path: /Audio/_Stories/Demons/Common/demon_dies.ogg
  - type: DemonImmunities
    smashDamage:
      types:
        Structural: 50
  - type: NoSlip
  - type: TemperatureDamage
    heatDamageThreshold: 10000
    coldDamageThreshold: -10000
  - type: Puller
    needsHands: false
  - type: Hands
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Ghost
  - type: VisionProvider
    isActive: true
    drawFov: false
    drawLighting: false
    shader: STRedVisionFullscreen
    priority: 10
  - type: DemonPhase
    anchor: Blood
    phasePolymorph: STPolymorphSlaughterDemonPhase
    searchRange: 1.5
    failPopup: slaughter-demon-phase-fail
    phaseOutEffect: STSlaughterDemonJauntEffect
    phaseInEffect: STSlaughterDemonJauntUpEffect
    phaseOutSound:
      path: /Audio/Effects/Fluids/blood1.ogg
    phaseInSound:
      path: /Audio/Effects/Fluids/blood2.ogg
    hallucinationChance: 0.25
    hallucinationSounds:
      path: /Audio/Effects/Fluids/splat.ogg
  - type: SlaughterDemon
    healOnConsume:
      types:
        Blunt: -1000
        Slash: -1000
        Piercing: -1000
        Heat: -1000
        Cold: -1000
        Shock: -1000
        Caustic: -1000
        Poison: -1000
        Radiation: -1000
        Asphyxiation: -1000
        Bloodloss: -1000
        Cellular: -1000
        Holy: -1000
    healOnMeagreConsume:
      types:
        Blunt: -20
        Slash: -20
  - type: DemonSpawnPhased
  - type: DemonWhisper
  - type: ActionGrant
    actions:
    - STActionBloodCrawl
    - STActionDemonWhisper
  - type: GhostRole
    name: stories-ghost-role-information-slaughter-demon-name
    description: stories-ghost-role-information-slaughter-demon-desc
    rules: stories-ghost-role-information-demon-rules
    mindRoles:
    - STMindRoleSlaughterDemon
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: Tag
    tags:
    - CannotSuicide
    - DoorBumpOpener

- type: entity
  id: STMobSlaughterDemonPhased
  categories: [ HideSpawnMenu ]
  name: странная кровь
  description: Нечто нематериальное, растворившееся в крови.
  parent:
  - Incorporeal
  - BaseMob
  components:
  - type: Sprite
    sprite: _Stories/Mobs/Demons/slaughter_demon.rsi
    color: "#AA0000AA"
    layers:
    - state: daemon
      shader: unshaded
  - type: MobState
    allowedStates:
    - Alive
  - type: MobThresholds
    thresholds:
      0: Alive
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 8
  - type: Puller
    needsHands: false
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Ghost
  - type: Visibility
    layer: 2
  - type: VisionProvider
    isActive: true
    drawFov: false
    drawLighting: false
    shader: STRedVisionFullscreen
    priority: 10
  - type: DemonPhase
    anchor: Blood
    phasePolymorph: STPolymorphSlaughterDemonPhase
    searchRange: 1.5
    failPopup: slaughter-demon-phase-fail
    phaseOutEffect: STSlaughterDemonJauntEffect
    phaseInEffect: STSlaughterDemonJauntUpEffect
    phaseOutSound:
      path: /Audio/Effects/Fluids/blood1.ogg
    phaseInSound:
      path: /Audio/Effects/Fluids/blood2.ogg
    hallucinationChance: 0.25
    hallucinationSounds:
      path: /Audio/Effects/Fluids/splat.ogg
  - type: SlaughterDemon
    healOnConsume:
      types:
        Blunt: -1000
        Slash: -1000
        Piercing: -1000
        Heat: -1000
        Cold: -1000
        Shock: -1000
        Caustic: -1000
        Poison: -1000
        Radiation: -1000
        Asphyxiation: -1000
        Bloodloss: -1000
        Cellular: -1000
        Holy: -1000
    healOnMeagreConsume:
      types:
        Blunt: -20
        Slash: -20
  - type: DemonWhisper
  - type: ActionGrant
    actions:
    - STActionBloodCrawl
    - STActionDemonWhisper
  - type: Tag
    tags:
    - CannotSuicide

- type: polymorph
  id: STPolymorphSlaughterDemonPhase
  configuration:
    entity: STMobSlaughterDemonPhased
    forced: true
    inventory: Drop
    allowRepeatedMorphs: true
    transferDamage: false
    transferName: false
    revertOnCrit: false
    revertOnDeath: false
