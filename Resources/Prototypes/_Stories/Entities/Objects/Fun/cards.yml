  - type: Openable
    closeable: true
    sound:
      path: /Audio/_Stories/Items/CardDeckBox/open.ogg
    closeSound:
      path: /Audio/_Stories/Items/CardDeckBox/close.ogg
  - type: CardDeckBox
  - type: Sprite
    sprite: _Stories/Objects/Fun/card.rsi
    layers:
    - state: closed
      map: ["enum.OpenableVisuals.Layer"]
    - state: box-1
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          components:
          - CardDeck
        insertSound:
          path: /Audio/_Stories/Items/CardDeckBox/addeck.ogg
        ejectSound:
          path: /Audio/_Stories/Items/CardDeckBox/removedeck.ogg

- type: entity
  parent: STCardDeckBox
  categories: [ HideSpawnMenu ]
  id: STCardDeckBoxOpen
  components:
  - type: Openable
    opened: true

- type: entity
  parent: STCardDeckBox
  id: STCardDeckBoxFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - STCardDeckFull

- type: entity
  parent: [STCardDeckBoxFilled, STCardDeckBoxOpen]
  categories: [ HideSpawnMenu ]
  id: STCardDeckBoxFilledOpen

- type: entity
  parent: STCardDeckBox
  categories: [ HideSpawnMenu ]
  id: STCardDeckBoxUSSP
  name: USSP card pack
  description: A deck primarily used in the USSP.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Fun/card.rsi
    layers:
    - state: closed_ussp
      map: ["enum.OpenableVisuals.Layer"]
    - state: box-1
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True:
            state: open_ussp
          False:
            state: closed_ussp

- type: entity
  parent: STCardDeckBoxUSSP
  categories: [ HideSpawnMenu ]
  id: STCardDeckBoxOpenUSSP
  components:
  - type: Openable
    opened: true

- type: entity
  parent: STCardDeckBoxUSSP
  id: STCardDeckBoxFilledUSSP
  name: USSP card pack
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - STCardDeckFullUSSP

- type: entity
  parent: [STCardDeckBoxFilledUSSP, STCardDeckBoxOpenUSSP]
  categories: [ HideSpawnMenu ]
  id: STCardDeckBoxFilledOpenUSSP
  name: USSP card pack
  components:
  - type: Openable
    opened: true
  - type: ContainerFill
    containers:
      ItemCabinet:
      - STCardDeckFullUSSP

- type: entity
  parent: BaseItem
  categories: [ HideSpawnMenu ]
  id: STCardFan
  name: card fan
  components:
  - type: Sprite
    sprite: _Stories/Objects/Fun/card.rsi
    state: Back
    layers:
    - state: Clubs1
  - type: CardFan
  - type: ContainerContainer
    containers:
      card-stack-container: !type:Container
  - type: CardStack
  - type: Tag
    tags:
    - STCard
  - type: UserInterface
    interfaces:
      enum.CardFanUiKey.Key:
        type: FanMenuBoundUserInterface
  - type: ActivatableUI
    inHandsOnly: true
    key: enum.CardFanUiKey.Key
  - type: Appearance
