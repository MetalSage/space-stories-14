- type: entity
  parent: [BaseItem, BaseFoldable]
  categories: [ HideSpawnMenu ]
  abstract: true
  id: STCardBase
  name: card
  components:
  - type: Sprite
    sprite: _Stories/Objects/Fun/card.rsi
    layers:
    - state: Back
      map: [ "unfoldedLayer" ]
  - type: Tag
    tags:
    - STCard
  - type: Foldable
    canFoldInsideContainer: true
  - type: Card
  - type: Appearance

