- type: entity
  parent: Paper
  id: STSheetPrinter
  name: paper
  description: A sheet of material widely used on the station for various purposes.
  suffix: Full
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      STSheetPrinter: 100
  - type: Stack
    stackType: STSheetPrinter
    baseLayer: paper
  - type: Sprite
    layers:
    - state: paper
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Tag
    tags:
    - Document

- type: entity
  parent: STSheetPrinter
  id: STSheetPrinter1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: SheetOtherBase
  id: STInkPrinter
  name: ink
  description: A sheet of material widely used on the station for various purposes.
  suffix: Full
  components:
  - type: Sprite
    sprite: _Stories/Objects/Misc/bureaucracy.rsi
    state: ink
  - type: Item
    size: Small
  - type: Stack
    stackType: STInkPrinter
    baseLayer: ink
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      STInk: 100
  - type: Tag
    tags:
    - Document

- type: entity
  parent: STInkPrinter
  id: STInkPrinter1
  suffix: Single
  components:
  - type: Stack
    count: 1
