- type: entity
  id: LandMineSpaf
  name: organic trap
  description: It is hard to understand its functionality by its appearance, but you definitely shouldn't step on it...
  parent: BaseLandMine
  components:
  - type: Sprite
    drawdepth: Items
    sprite: _Stories/Objects/Misc/spafmine.rsi
    layers:
    - state: spafmine-inactive
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True:
            state: spafmine
          False:
            state: spafmine-inactive
  - type: FlashOnTrigger
  - type: StealthOnMove
  - type: Stealth
  - type: ItemToggle
    activated: true
    onActivate: false
