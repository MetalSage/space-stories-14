- type: entity
  parent: BaseItem
  id: STItemDemonHeartSlaughter
  name: демоническое сердце
  description: Оно всё ещё яростно бьётся, излучая ауру абсолютной ненависти.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Demons/demon_heart.rsi
    layers:
    - state: icon
      shader: unshaded
  - type: Item
    size: Small
  - type: DemonHeart
    grantedAction: STActionBloodCrawl
    consumedMessage: st-demon-heart-slaughter-consumed
    components:
    - type: DemonPhase
      anchor: Blood
      phasePolymorph: STPolymorphSlaughterDemonPhase
      searchRange: 1.5
      failPopup: slaughter-demon-phase-fail
      phaseOutEffect: STSlaughterDemonJauntEffect
      phaseInEffect: STSlaughterDemonJauntUpEffect
      phaseOutSound:
        path: /Audio/Effects/Fluids/blood1.ogg
      phaseInSound:
        path: /Audio/Effects/Fluids/blood2.ogg
      hallucinationChance: 0.25
      hallucinationSounds:
        path: /Audio/Effects/Fluids/splat.ogg
    - type: SlaughterDemon
      healOnConsume:
        types:
          Blunt: -1000
          Slash: -1000
          Piercing: -1000
          Heat: -1000
          Cold: -1000
          Shock: -1000
          Caustic: -1000
          Poison: -1000
          Radiation: -1000
          Asphyxiation: -1000
          Bloodloss: -1000
          Cellular: -1000
          Holy: -1000
      healOnMeagreConsume:
        types:
          Blunt: -20
          Slash: -20

- type: entity
  parent: BaseItem
  id: STItemDemonHeartShadow
  name: сердце тьмы
  description: Оно всё ещё бьётся, излучая ауру страха.
  components:
  - type: Sprite
    sprite: _Stories/Objects/Demons/demon_heart.rsi
    color: "#4B2A6B"
    layers:
    - state: icon
      shader: unshaded
  - type: Item
    size: Small
  - type: DemonHeart
    grantedAction: STActionShadowGrapple
    consumedMessage: st-demon-heart-shadow-consumed
    components:
    - type: ShadowGrapple
      hitDamage:
        types:
          Blunt: 40
