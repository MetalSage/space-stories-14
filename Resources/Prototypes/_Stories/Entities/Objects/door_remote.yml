- type: entity
  parent: DoorRemoteDefault
  id: PRISONDoorRemote
  name: prison airlock remote
  description: A gadget that can open and close airlocks remotely.
  components:
  - type: Sprite
    layers:
    - state: door_remotebase
    - state: door_remotelightscolour
      color: "#5268cc"
    - state: door_remotescreencolour
      color: "#2f3d79"
  - type: Access
    groups:
    - PrisonAllAccess
