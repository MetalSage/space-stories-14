- type: entity
  parent: BaseLathe
  id: STPrinterDoc
  name: paper printer
  description: A bureaucratic ideal. It stores documents in its database and allows printing them as long as you have paper and ink.
  components:
  - type: Sprite
    sprite: _Stories/Structures/Machines/printer.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: idle
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Transform
    noRot: false
  - type: Machine
    board: STPrinterDocMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/scanning.ogg
    idleState: icon
    runningState: building
    staticPacks:
    - STPrinterDocStatic
  - type: EmagLatheRecipes
    emagStaticPacks:
    - STEmagPrinterDocStatic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.4,0.25,0.4"
        density: 25
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: MaterialStorage
    whitelist:
      tags:
      - Document
    storage:
      STSheetPrinter: 0
      STInk: 0

- type: entity
  parent: STPrinterDoc
  id: STPrinterDocSyndie
  name: syndicate paper printer
  components:
  - type: Lathe
    producingSound: /Audio/Machines/scanning.ogg
    idleState: icon
    runningState: building
    staticPacks:
    - STPrinterDocSyndieStatic

