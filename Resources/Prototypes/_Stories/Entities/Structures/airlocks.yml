# HeadOfPrison

- type: entity
  parent: AirlockGlass
  name: head of prison glass airlock
  description: It opens, it closes, and it can crush you.
  id: PRISONAirlockGlassLockedHeadOfPrison
  suffix: HeadOfPrison, Locked
  components:
    - type: Sprite
      sprite: _Stories/Structures/Doors/Airlocks/Glass/security.rsi
