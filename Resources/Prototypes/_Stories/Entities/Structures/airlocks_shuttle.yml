- type: entity
  parent: AirlockShuttle
  name: shuttle airlock
  description: Required to connect two spaceships together.
  id: STPRISONAirlockShuttleLocked
  suffix: Prison, Docking, Locked
  components:
    - type: Sprite
      sprite: _Stories/Structures/Doors/Airlocks/Standard/shuttle_sp.rsi
      layers:
      - state: docking-clamp
        sprite: Structures/Doors/Airlocks/Standard/shuttle-base.rsi
        offset: 0, -1
      - state: closed
        map: ["enum.DoorVisualLayers.Base"]
      - state: closed_unlit
        shader: unshaded
        sprite: Structures/Doors/Airlocks/Effects/airlock-effects-shuttle.rsi
        map: ["enum.DoorVisualLayers.BaseUnlit"]
        visible: true
      - state: welded
        sprite: Structures/Doors/Airlocks/Effects/airlock-effects-shuttle.rsi
        map: ["enum.WeldableLayers.BaseWelded"]
      - state: bolted_unlit
        shader: unshaded
        sprite: Structures/Doors/Airlocks/Effects/airlock-effects-shuttle.rsi
        map: ["enum.DoorVisualLayers.BaseBolted"]
      - state: emergency_unlit
        sprite: Structures/Doors/Airlocks/Effects/airlock-effects-shuttle.rsi
        map: ["enum.DoorVisualLayers.BaseEmergencyAccess"]
        shader: unshaded
      - state: panel_open
        sprite: Structures/Doors/Airlocks/Effects/airlock-effects-shuttle.rsi
        map: ["enum.WiresVisualLayers.MaintenancePanel"]
      - state: electrified_ai
        sprite: Interface/Misc/ai_hud.rsi
        shader: unshaded
        visible: false
        map: ["enum.ElectrifiedLayers.HUD"]
      - state: electrified
        sprite: Effects/electricity.rsi
        shader: unshaded
        visible: false
        map: ["enum.ElectrifiedLayers.Sparks"]
      - state: sparks
        sprite: Structures/Doors/Airlocks/Effects/airlock-effects.rsi
        map: ["enum.DoorVisualLayers.BaseEmagging"]
        shader: unshaded
        visible: false
    - type: ContainerFill
      containers:
        board: [STPRISONDoorElectronics]

