- type: entity
  parent: AirlockShuttle
  name: shuttle airlock
  description: Required to connect two spaceships together.
  id: STPRISONAirlockShuttleLocked
  suffix: Prison, Docking, Locked
  components:
    - type: Sprite
      sprite: _Stories/Structures/Doors/Airlocks/Standard/shuttle_sp.rsi
      layers:
      - state: docking-clamp
        sprite: Structures/Doors/Airlocks/Standard/shuttle-base.rsi
        offset: 0, -1
      - state: closed
        map: ["enum.DoorVisualLayers.Base"]
    - type: ContainerFill
      containers:
        board: [STPRISONDoorElectronics]

- type: entity
  parent: AirlockGlassShuttle
  name: shuttle airlock
  description: Required to connect two spaceships together.
  id: STPRISONAirlockGlassShuttleLocked
  suffix: Prison, Docking, Glass, Locked
  components:
    - type: ContainerFill
      containers:
        board: [STPRISONDoorElectronics]
    - type: Sprite
      sprite: _Stories/Structures/Doors/Airlocks/Glass/shuttle_sp.rsi
      layers:
      - state: docking-clamp
        sprite: Structures/Doors/Airlocks/Standard/shuttle-base.rsi
        offset: 0, -1
      - state: closed
        map: ["enum.DoorVisualLayers.Base"]
