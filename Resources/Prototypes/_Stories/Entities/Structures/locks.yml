- type: entity
  id: STPRISONLocker
  parent: LockerBase
  name: prison staff locker
  description: Standard prison staff locker.
  components:
    - type: Sprite
      sprite: _Stories/Structures/Storage/closet.rsi
    - type: Appearance
    - type: EntityStorageVisuals
      stateBaseClosed: sp
      stateDoorOpen: sp_open
      stateDoorClosed: sp_door
    - type: AccessReader
      access: [["Prison"]]

- type: entity
  id: STPRISONLockerHeadOfPrison
  parent: STPRISONLocker
  name: prison head of personnel's locker
  description: Standard prison staff locker.
  components:
    - type: Appearance
    - type: EntityStorageVisuals
      stateBaseClosed: hosofsp
      stateDoorOpen: hosofsp_open
      stateDoorClosed: hosofsp_door
    - type: AccessReader
      access: [["STHeadOfPrison"]]
