- type: entity
  parent: VendingMachine
  id: PRISONVendingMachineDrobe
  name: Prison staff locker
  description: A vending machine for clothing related to prisoners and escapes!
  components:
    - type: VendingMachine
      pack: PRISONDrobeInventory
      offState: off
      brokenState: broken
      normalState: normal-unshaded
    - type: DatasetVocalizer
      dataset: SecDrobeAds
    - type: Sprite
      sprite: _Stories/Structures/Machines/VendingMachines/spdrobe.rsi
      layers:
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.Base"]
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
          shader: unshaded
        - state: panel
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: AccessReader
      access: [["Prison"]]

- type: entity
  parent: VendingMachine
  id: PRISONVendingMachine
  name: Prison staff vending machine
  description: A vending machine containing prison staff gear. The sign says "PRISON STAFF ONLY".
  components:
    - type: VendingMachine
      pack: PRISONTechInventory
      offState: off
      brokenState: broken
      normalState: normal-unshaded
      ejectState: eject-unshaded
      denyState: deny-unshaded
    - type: DatasetVocalizer
      dataset: SecTechAds
    - type: SpeakOnUIClosed
      pack: SecTechGoodbyes
    - type: Sprite
      sprite: _Stories/Structures/Machines/VendingMachines/secMachineSP.rsi
      layers:
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.Base"]
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
          shader: unshaded
        - state: panel
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: AccessReader
      access: [["Prison"]]
    - type: PointLight
      radius: 1
      energy: 1.2
      color: "#78645c"

- type: entity
  abstract: true
  parent: VendingMachine
  id: MusicalVendingMachineBase
  name: MusMat
  description: Vending machine with musical instruments.
  components:
    - type: VendingMachine
      pack: MusVendInventory
      offState: off
      brokenState: broken
      normalState: normal-unshaded
      denyState: deny-unshaded
    - type: DatasetVocalizer
      dataset: SecTechAds
    - type: SpeakOnUIClosed
      pack: SecTechGoodbyes
    - type: Sprite
      sprite: _Stories/Structures/Machines/VendingMachines/musmat.rsi
      layers:
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.Base"]
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
          shader: unshaded
        - state: panel
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: PointLight
      radius: 1
      energy: 1.2
      color: "#6f42d6"

- type: entity
  parent: MusicalVendingMachineBase
  id: MusicalVendingMachine
  suffix: Station
  components:
    - type: AccessReader
      access: [["Theatre"]]

- type: entity
  parent: MusicalVendingMachineBase
  id: MusicalVendingMachinePrison
  suffix: Prison
  components:
    - type: AccessReader
      access: [["Prison"]]
