- type: entity
  parent: VendingMachine
  id: STPRISONVendingMachineDrobe
  name: Prison staff locker
  description: A vending machine for clothing related to prisoners and escapes!
  components:
    - type: VendingMachine
      pack: STPRISONDrobeInventory
      freeJobs:
      - STPRISONHeadOfPrison
      - STPRISONEngineer
      - STPRISONMedic
      - STPRISONOfficer
    - type: VendingMachineVisuals
      offState: off
      brokenState: broken
      normalState: normal-unshaded
    - type: DatasetVocalizer
      dataset: SecDrobeAds
    - type: Sprite
      sprite: _Stories/Structures/Machines/VendingMachines/spdrobe.rsi
      layers:
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.Base"]
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
          shader: unshaded
        - state: panel
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: AccessReader
      access: [["Prison"]]

- type: entity
  parent: VendingMachine
  id: STPRISONVendingMachine
  name: Prison staff vending machine
  description: A vending machine containing prison staff gear. The sign says "PRISON STAFF ONLY".
  components:
    - type: VendingMachine
      pack: STPRISONTechInventory
      freeJobs:
      - STPRISONHeadOfPrison
      - STPRISONEngineer
      - STPRISONMedic
      - STPRISONOfficer
    - type: VendingMachineVisuals
      offState: off
      brokenState: broken
      normalState: normal-unshaded
      ejectState: eject-unshaded
      denyState: deny-unshaded
    - type: DatasetVocalizer
      dataset: SecTechAds
    - type: SpeakOnUIClosed
      pack: SecTechGoodbyes
    - type: Sprite
      sprite: _Stories/Structures/Machines/VendingMachines/secMachineSP.rsi
      layers:
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.Base"]
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
          shader: unshaded
        - state: panel
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: AccessReader
      access: [["Prison"]]
    - type: PointLight
      radius: 1
      energy: 1.2
      color: "#78645c"

- type: entity
  abstract: true
  parent: VendingMachine
  id: STMusicalVendingMachineBase
  name: MusMat
  description: Vending machine with musical instruments.
  components:
    - type: VendingMachine
      pack: STMusVendInventory
    - type: VendingMachineVisuals
      offState: off
      brokenState: broken
      normalState: normal-unshaded
      denyState: deny-unshaded
    - type: DatasetVocalizer
      dataset: SecTechAds
    - type: SpeakOnUIClosed
      pack: SecTechGoodbyes
    - type: Sprite
      sprite: _Stories/Structures/Machines/VendingMachines/musmat.rsi
      layers:
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.Base"]
        - state: "off"
          map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
          shader: unshaded
        - state: panel
          map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - type: PointLight
      radius: 1
      energy: 1.2
      color: "#6f42d6"

- type: entity
  parent: STMusicalVendingMachineBase
  id: STMusicalVendingMachine
  suffix: Station
  components:
    - type: VendingMachine
      freeJobs:
      - Clown
      - Mime
    - type: AccessReader
      access: [["Theatre"]]

- type: entity
  parent: STMusicalVendingMachineBase
  id: STMusicalVendingMachinePrison
  suffix: Prison
  components:
    - type: VendingMachine
      freeJobs:
      - STPRISONHeadOfPrison
      - STPRISONEngineer
      - STPRISONMedic
      - STPRISONOfficer
    - type: AccessReader
      access: [["Prison"]]
