- type: forcePreset
  id: Debug
  name: Hacker
  side: Debug
  volume: 500
  alert: STForceVolume
  maxVolume: 1000
  componentsToAdd:
  - type: Empire
  - type: Store
    balance:
      STSkillPoint: 9999
    categories:
    - Force
    - STForceLight
    - STForceDark
    currencyWhitelist:
    - STSkillPoint

- type: forcePreset
  id: STInquisitor
  name: Inquisitor
  side: Dark
  volume: 140
  alert: STInquisitorForceVolume
  maxVolume: 150
  passiveVolume: 10
  componentsToAdd:
  - type: Prying
    speedModifier: 3
    pryPowered: !type:Bool
      true
    force: !type:Bool
      true
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: Empire
  - type: Store
    balance:
      STSkillPoint: 20
    categories:
    - STForceDark
    - Force
    currencyWhitelist:
    - STSkillPoint
  componentsToRemove:
  - type: Strippable

- type: forcePreset
  id: Guardian
  name: Jedi
  side: Light
  volume: 140
  alert: STGuardianNtForceVolume
  maxVolume: 150
  passiveVolume: 10
  componentsToAdd:
  - type: Store
    balance:
      STSkillPoint: 10
    categories:
    - STForceLight
    - Force
    currencyWhitelist:
    - STSkillPoint
