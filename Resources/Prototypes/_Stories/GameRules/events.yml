- type: entity
  id: SpafMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    minimumPlayers: 30
    weight: 6.5
    duration: 5
    maxDuration: 20
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 1, 2
      children:
      - id: SpawnPointGhostSpaf

- type: entity
  id: STJobDistributionError
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: stories-station-event-job-distribution-error-announcement
    minimumPlayers: 25
    weight: 3
    duration: 1
  - type: JobDistributionErrorRule
    jobs:
    - STSecurityClown
    - STPartyMaker
    - STCommandMaid

- type: entity
  id: STCorpiumSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 20
    minimumPlayers: 30
    weight: 6.5
    duration: 5
    maxDuration: 20
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 3, 6
      children:
      - id: STSpawnPointGhostCorpium

- type: entity
  parent: BaseAntagGhostRoleRule
  id: STSlaughterDemonSpawn
  components:
  - type: StationEvent
    weight: 6
    earliestStart: 30
    minimumPlayers: 25
    duration: null
  - type: AntagRandomSpawn
  - type: AntagSpawner
    prototype: STMobSlaughterDemon
  - type: AntagObjectives
    objectives:
    - STSlaughterDevourObjective
    - STSlaughterFluffObjective
  - type: AntagSelection
    agentName: st-slaughter-demon-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: STSlaughterDemonAntag

- type: entity
  parent: BaseAntagGhostRoleRule
  id: STShadowDemonSpawn
  components:
  - type: StationEvent
    weight: 6
    earliestStart: 30
    minimumPlayers: 30
    duration: null
  - type: ShadowDemonSpawnLocation
  - type: AntagSpawner
    prototype: STMobShadowDemon
  - type: AntagObjectives
    objectives:
    - STShadowWrapObjective
    - STShadowSurviveObjective
  - type: AntagSelection
    agentName: st-shadow-demon-round-end-agent-name
    antags:
    - !type:FixedAntagCount
      proto: STShadowDemonAntag
