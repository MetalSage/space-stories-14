- type: entity
  parent: BaseGameRule
  id: STBaseInquisitorSpawn

- type: entity
  parent: BaseGameRule
  id: STInquisitorSpawn
  components:
  - type: InquisitorRule
  - type: StationEvent
    earliestStart: 35
    reoccurrenceDelay: 60
    weight: 7.5
    minimumPlayers: 15
    duration: 1
  - type: AntagObjectives
    objectives:
    - STKillGuardianNtObjective
    - STInquisitorSurviveObjective
#    - STHypnosisObjective
  - type: AntagLoadProfileRule
    speciesOverride: Human
    speciesOverrideBlacklist:
    - Vox
  - type: RuleGrids
  - type: LoadMapRule
    mapPath: /Maps/_Stories/Nonstations/inquisitor_station.yml
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: STInquisitorSpecifier
      count: 1

- type: antagSpecifier
  id: STInquisitorSpecifier
  spawnerPrototype: STSpawnPointInquisitor
  pickPlayer: false
  startingGear: STInquisitorGear
  components:
  - type: Barotrauma
    protectionSlots:
    - head
    - neck
    damage:
      types:
        Blunt: 0.55
  - type: Force
  - type: ForceUser
    preset: STInquisitor
  - type: AutoImplant
    implants:
    - DeathAcidifierImplant
  - type: IntrinsicRadioReceiver
  - type: IntrinsicRadioTransmitter
    channels:
    - STEmpire
  - type: ActiveRadio
    channels:
    - STEmpire
  - type: Stamina
    stunTime: 3
    decay: 6
    cooldown: 1
    baseCritThreshold: 400
  - type: Puller
    needsHands: false
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: StatusEffects
    allowed:
    - Stun
    - KnockedDown
    - SlowedDown
    - Stutter
    - SeeingRainbows
    - Electrocution
    - Drunk
    - SlurredSpeech
    - RatvarianLanguage
    - PressureImmunity
    - STFrozeBullets
    - Muted
    - ForcedSleep
    - TemporaryBlindness
    - Pacified
    - StaminaModifier
  - type: RandomMetadata
    nameSegments:
    - STInquisitorTitle
    - STInquisitor
    nameFormat: name-format-standard
  - type: NpcFactionMember
    factions:
    - Syndicate
  mindRoles:
  - STMindRoleEmpireMember

