- type: entity
  id: STSpafMigration
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 15
    minimumPlayers: 30
    weight: 6.5
    duration: 5
    maxDuration: 20
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 1, 2
      children:
      - id: STSpawnPointGhostSpaf

- type: entity
  id: STJobDistributionError
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: stories-station-event-job-distribution-error-announcement
    minimumPlayers: 25
    weight: 3
    duration: 1
  - type: JobDistributionErrorRule
    jobs:
    - STSecurityClown
    - STPartyMaker
    - STCommandMaid

- type: entity
  id: STCorpiumSpawn
  parent: BaseStationEventShortDelay
  components:
  - type: StationEvent
    startAnnouncement: station-event-vent-creatures-start-horde-announcement
    startAudio:
      path: /Audio/Announcements/attention.ogg
    earliestStart: 20
    minimumPlayers: 30
    weight: 6.5
    duration: 5
    maxDuration: 20
  - type: VentHordeRule
    table: !type:GroupSelector
      rolls: 3, 6
      children:
      - id: STSpawnPointGhostCorpium
