- type: objectiveIssuer
  id: STInquisitor
  name: objective-issuer-inquisitor

- type: entity
  abstract: true
  parent: BaseObjective
  id: STBaseInquisitorObjective
  components:
  - type: Objective
    issuer: STInquisitor
    difficulty: 1.0
  - type: RoleRequirement
    roles:
    - EmpireMemberRole

- type: entity
  parent: [STBaseInquisitorObjective, BaseKillObjective]
  id: STKillGuardianNtObjective
  description: Destroy it.
  components:
  - type: Objective
    difficulty: 3.0
    unique: true
  - type: TargetObjective
    title: objective-condition-kill-head-title
  - type: PickRandomJobPerson
    jobID: STGuardianNt
  - type: KillPersonCondition
    requireDead: true

- type: entity
  parent: [STBaseInquisitorObjective, BaseSurviveObjective]
  id: STInquisitorSurviveObjective
  name: Survive.
  description: You have no plans to die.
  components:
  - type: Objective
    difficulty: 1.0
    icon:
      sprite: _Stories/Mobs/Ghosts/inquisitor.rsi
      state: inquisitor

- type: entity
  parent: STBaseInquisitorObjective
  id: STHypnosisObjective
  description: The Emperor needs new subjects.
  components:
  - type: Objective
    icon:
      sprite: _Stories/Mobs/Ghosts/inquisitor.rsi
      state: empire
  - type: NumberObjective
    min: 3
    max: 3
    title: objective-inquisitor-hypnosis-title
  - type: HypnosisCondition
