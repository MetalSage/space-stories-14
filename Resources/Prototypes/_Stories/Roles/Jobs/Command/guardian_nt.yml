- type: job
  id: STGuardianNt
  name: stories-job-name-guardian-nt
  description: stories-job-description-guardian-nt
  playTimeTracker: STJobGuardianNt
  setPreference: false
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 10h
    - !type:DepartmentTimeRequirement
      department: Security
      time: 5h
    - !type:DepartmentTimeRequirement
      department: Command
      time: 3h
  startingGear: STGuardianNtGear
  icon: "STJobIconGuardianNt"
  supervisors: job-supervisors-centcom
  accessGroups:
  - AllAccess
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
    - type: Force
    - type: ForceUser
      preset: Guardian
  minBankBalance: 250
  maxBankBalance: 300

- type: startingGear
  id: STGuardianNtGear
  equipment:
    id: STGuardianNtPDA
    ears: STClothingHeadsetGuardianNtAlt
    gloves: ClothingHandsGlovesCombat
    eyes: ClothingEyesGlassesSecurity

- type: chameleonOutfit
  id: STGuardianNtChameleonOutfit
  job: STGuardianNt
  hasMindShield: true
  equipment:
    head: STClothingHeadHatExe
    mask: STClothingMaskGasExe
    neck: STClothingNeckMantleGuardianNt
    outerClothing: STClothingOuterVestGuardianNt
    jumpsuit: STClothingUniformJumpsuitGuardianNt
    back: STClothingBackpackGuardianNt
    shoes: STClothingShoesBootsJackGuardianNt
