- type: job
  id: STPRISONHeadOfPrison
  name: начальник космической тюрьмы
  description: Охраняйте это место используя все возможное и невозможно, иначе на свободу вырвутся самые опасные обитатели вселенной.
  playTimeTracker: STJobHeadOfSpacePrison
  requirements:
    - !type:RoleTimeRequirement
      role: JobWarden
      time: 18000 # 5 hours
    - !type:DepartmentTimeRequirement
      department: Prison
      time: 18000 # 5 hours
  startingGear: STPRISONHeadOfPrisonGear
  icon: "STJobIconHeadOfSpacePrison"
  requireAdminNotify: true
  supervisors: job-supervisors-centcom
  accessGroups:
  - STPrisonAllAccess
  access:
  - Command
  - Armory
  - Bar
  - Brig
  - Security
  - Maintenance
  - External
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  minBankBalance: 300
  maxBankBalance: 350

- type: startingGear
  id: STPRISONHeadOfPrisonGear
  storage:
    back:
    - WeaponPistolMk58
    - Flash
    - MagazinePistol
  equipment:
    jumpsuit: STPRISONClothingUniformJumpsuitHeadOfPrison
    id: STPRISONPDAHeadOfPrison
    ears: STPRISONClothingHeadsetAlt
    outerClothing: STPRISONClothingOuterCoatHeadOfPrison
    eyes: STPRISONClothingEyesGlasses
    belt: STPRISONClothingBeltSheathFilled

- type: chameleonOutfit
  id: STPRISONHeadOfPrisonChameleonOutfit
  job: STPRISONHeadOfPrison
  hasMindShield: true
  equipment:
    mask: ClothingMaskGasSecurity
    neck: Dinkystar
