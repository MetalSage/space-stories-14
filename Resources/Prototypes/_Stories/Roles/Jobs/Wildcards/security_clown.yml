- type: job
  id: STSecurityClown
  name: stories-job-name-security-clown
  description: stories-job-description-security-clown
  playTimeTracker: STJobSecurityClown
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 2h
  - !type:RoleTimeRequirement
    role: JobClown
    time: 1h
  startingGear: STSecurityClownGear
  icon: "STJobIconSecurityClown"
  supervisors: job-supervisors-security
  setPreference: false
  access:
  - Security
  - Brig
  - Maintenance
  - Service
  - Theatre
  - External
  - Cryogenics
  special:
  - !type:AddComponentSpecial
    components:
    - type: PermanentStatusEffects
      statusEffects:
      - StatusEffectClumsyClown
    - type: SleepEmitSound
      snore: /Audio/Voice/Misc/silly_snore.ogg
      interval: 10
  - !type:AddImplantSpecial
    implants: [ SadTromboneImplant, MindShieldImplant ]
  minBankBalance: 50
  maxBankBalance: 100

- type: startingGear
  id: STSecurityClownGear
  equipment:
    mask: ClothingMaskClownSecurity
    jumpsuit: ClothingUniformJumpsuitClown
    shoes: ClothingShoesClown
    outerClothing: ClothingOuterArmorBasic
    id: STSecurityClownPDA
    ears: ClothingHeadsetSecurity
    belt: BikeHorn
  storage:
    back:
    - Flash
    - ClownRecorder

- type: chameleonOutfit
  id: STSecurityClownChameleonOutfit
  job: STSecurityClown
  equipment:
    head: ClothingHeadHatBeret
    neck: Dinkystar
